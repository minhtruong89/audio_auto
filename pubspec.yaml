name: audio_auto
description: "VocalAI Karaoke Studio - On-Device Voice Profiling & Karaoke DSP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^7.1.2
  audioplayers: ^6.8.1
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
